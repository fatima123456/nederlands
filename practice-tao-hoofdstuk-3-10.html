<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nederlands oefenen — Tao hoofdstuk 1-10 (nieuwe woorden)</title>
    <!-- home screen + iOS: standalone launch, icon, themed status bar.
         Paths are relative so the app works under a GitHub Pages subpath. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nederlands" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0ece3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1b18" />
    <style>
      :root {
        --bg: #f0ece3;
        --card: #fbf9f4;
        --ink: #3b3a36;
        --accent: #3f72a8;
        --good: #4f9e63;
        --bad: #c0604a;
        --muted: #8d877b;
        --surface: #f5f1e9;
        --border: #e2dccf;
        --chip: #ece6da;
        --chip-border: #ddd4c4;
        --row-border: #e6e0d4;
        --ok-bg: #e9f1e4;
        --bad-bg: #f6e7e0;
        --shadow: rgba(60, 50, 30, 0.07);
      }
      :root[data-theme="dark"] {
        --bg: #1c1b18;
        --card: #24231f;
        --ink: #dcd9d0;
        --accent: #6c9cd6;
        --good: #5aa86f;
        --bad: #d4715c;
        --muted: #9a9388;
        --surface: #2c2b26;
        --border: #403e37;
        --chip: #34332d;
        --chip-border: #4a483f;
        --row-border: #3a382f;
        --ok-bg: #25382a;
        --bad-bg: #3a2622;
        --shadow: rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 28px 16px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
        text-align: center;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 0.85rem;
      }

      .modes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 18px;
        max-width: 560px;
      }
      .modes button {
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--ink);
        padding: 7px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .modes button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .modes button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .stage {
        width: min(480px, 92vw);
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 6px 22px var(--shadow);
        padding: 28px 24px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-bottom: 16px;
      }
      .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 10px;
        text-align: center;
      }
      .prompt {
        font-size: 1.45rem;
        text-align: center;
        font-weight: 600;
      }
      .prompt small {
        display: block;
        font-size: 0.95rem;
        font-weight: 400;
        color: var(--muted);
        margin-top: 8px;
      }

      /* flashcard */
      .flip {
        perspective: 1200px;
        cursor: pointer;
      }
      .flip .inner {
        display: grid;
        transition: transform 0.5s;
        transform-style: preserve-3d;
      }
      .flip.flipped .inner {
        transform: rotateY(180deg);
      }
      .flip .face {
        grid-area: 1 / 1;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        background: var(--card);
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .flip .front {
        transform: rotateY(0deg);
      }
      .flip .back {
        transform: rotateY(180deg);
      }
      .verb {
        font-size: 1.9rem;
        font-weight: 700;
        color: var(--accent);
      }
      .pp {
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: 6px;
      }
      .sentence {
        font-size: 1.1rem;
        margin-top: 12px;
      }
      .translation {
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: 6px;
      }
      .tap {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 16px;
      }

      /* choices */
      .choices {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
      }
      .choices button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        padding: 12px;
        border-radius: 10px;
        font-size: 1.05rem;
        cursor: pointer;
        text-align: center;
      }
      .choices button:hover {
        border-color: var(--accent);
      }
      .choices button.correct {
        background: var(--good);
        border-color: var(--good);
        color: #fff;
      }
      .choices button.wrong {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .choices button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .rec-pace {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 16px;
      }
      .rec-pace button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .rec-pace button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .choices button:disabled {
        cursor: default;
      }

      /* type */
      input[type="text"] {
        width: 100%;
        padding: 12px;
        font-size: 1.1rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        border-radius: 10px;
        margin-top: 18px;
        text-align: center;
      }
      input::placeholder {
        color: var(--muted);
      }
      input.correct {
        border-color: var(--good);
        background: var(--ok-bg);
      }
      input.wrong {
        border-color: var(--bad);
        background: var(--bad-bg);
      }

      /* builder */
      .answer-zone {
        min-height: 48px;
        border: 2px dashed var(--border);
        border-radius: 10px;
        padding: 8px;
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-content: flex-start;
      }
      .bank {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
        justify-content: center;
      }
      .tok {
        background: var(--chip);
        color: var(--ink);
        border: 1px solid var(--chip-border);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        font-size: 1rem;
      }
      .answer-zone .tok {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .feedback {
        text-align: center;
        min-height: 24px;
        margin-top: 14px;
        font-size: 1rem;
      }
      .feedback.good {
        color: var(--good);
      }
      .feedback.bad {
        color: var(--bad);
      }
      .reveal {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .controls button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .controls button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--muted);
      }
      .controls button.speak {
        background: #5a4ec4;
      }
      .score {
        font-size: 0.85rem;
        color: var(--muted);
        min-width: 110px;
        text-align: center;
      }

      /* choice example reveal */
      .example {
        text-align: center;
        margin-top: 16px;
        min-height: 0;
      }
      .example .nl {
        font-size: 1.05rem;
      }
      .example .en {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 4px;
      }

      /* choice results */
      .results {
        margin-top: 14px;
      }
      .result-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 4px;
        border-bottom: 1px solid var(--row-border);
        font-size: 1rem;
      }
      .result-row:last-child {
        border-bottom: none;
      }
      .result-list {
        margin-top: 14px;
      }
      .restart {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
      }

      /* back to index */
      .back-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 20;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        text-decoration: none;
      }
      .back-link:hover { border-color: var(--accent); color: var(--accent); }

      /* theme toggle */
      .theme-toggle {
        position: fixed;
        top: 48px;
        left: 12px;
        z-index: 20;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      /* vowel pronunciation helper (side panel) */
      .vowel-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .vowel-panel {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        height: 100dvh;
        width: 264px;
        background: var(--card);
        box-shadow: -4px 0 20px var(--shadow);
        padding: 52px 14px 20px;
        overflow-y: auto;
        z-index: 15;
        transform: translateX(100%);
        transition: transform 0.25s;
      }
      .vowel-panel.open {
        transform: translateX(0);
      }
      .vowel-panel h2 {
        font-size: 0.95rem;
        margin: 0 0 4px;
      }
      .vowel-hint {
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .vowel-group {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      .vrow {
        padding: 6px 0;
        border-bottom: 1px solid var(--row-border);
      }
      .vrow .snd {
        font-size: 0.85rem;
        font-weight: 600;
      }
      .vrow .spell {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .vwords {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 5px;
      }
      .vword {
        background: var(--chip);
        color: var(--ink);
        border: 1px solid var(--chip-border);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .vword:hover {
        border-color: var(--accent);
      }

      /* immersive auto-review: stage fills the viewport, everything else hidden */
      body.immersive {
        padding: 0;
        overflow: hidden;
      }
      body.immersive > *:not(.stage) {
        display: none !important;
      }
      .stage.immersive {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        background: var(--bg);
        padding: 6vmin;
        gap: 4vmin;
        overflow-y: auto;
      }
      .stage.immersive .label {
        font-size: clamp(1rem, 3vw, 1.8rem);
        letter-spacing: 0.15em;
      }
      .stage.immersive .rev-big .verb {
        font-size: clamp(4rem, 18vw, 16rem);
        line-height: 1.1;
        overflow-wrap: break-word;
      }
      /* An idiom is not a headword. At 18vw a six-word phrase wraps to four
         lines and runs off the top and bottom of the screen, which is exactly
         what happened to "iets met een korreltje zout nemen". A phrase borrows
         the sentence size, which is the size that exists for multi-word Dutch. */
      .stage.immersive .rev-big .verb.phrase {
        font-size: clamp(1.3rem, 5.2vw, 3.5rem);
      }
      .stage.immersive .rev-big .sentence {
        font-size: clamp(1.3rem, 5.2vw, 3.5rem);
        line-height: 1.15;
        overflow-wrap: break-word;
      }
      .stage.immersive .pp {
        font-size: clamp(1rem, 3vw, 2.2rem);
        margin-top: 1.5vmin;
      }
      .stage.immersive .rev-ex .en {
        font-size: clamp(1.5rem, 6vw, 4rem);
      }
      .stage.immersive .rev-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(26px + env(safe-area-inset-bottom));
        margin: 0;
        text-align: center;
        z-index: 25;
      }
      .stage.immersive .restart {
        font-size: 1.2rem;
        padding: 14px 30px;
      }
      .rev-exit {
        position: fixed;
        top: calc(18px + env(safe-area-inset-top));
        right: 18px;
        z-index: 30;
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .rev-progress {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 6px;
        background: rgba(138, 132, 121, 0.25);
        z-index: 30;
      }
      .rev-progress > span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.3s ease;
      }
      .rev-controls button {
        margin: 0 6px;
      }
      .rev-controls .mistake {
        background: var(--bad);
      }
      .rev-controls .mistake.marked {
        background: var(--good);
      }
      .fen-count {
        display: block;
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* recall level row: start button + small review button */
      /* batch picker: a size row (5 / 10 / 15 / 20 / alles) over group rows */
      .batch-sizes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 6px;
      }
      .batch-size {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .batch-size:hover { border-color: var(--accent); color: var(--accent); }
      .batch-size.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .batch-row {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
        font-size: 1rem;
        color: var(--ink);
      }
      .batch-row:hover { border-color: var(--accent); }
      .batch-head { display: block; font-weight: 600; color: var(--accent); }

      .rec-level-row {
        display: flex;
        gap: 8px;
      }
      .rec-level-row .rec-start {
        flex: 1;
      }
      .rec-level-row .rec-review {
        flex: 0 0 auto;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        border-radius: 10px;
        padding: 0 16px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .rec-level-row .rec-review:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* sentence-review popup: Dutch-only list to revise before practice */
      .rev-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 40;
      }
      .rev-modal.open {
        display: flex;
      }
      .rev-modal-box {
        background: var(--card);
        border-radius: 14px;
        width: 100%;
        max-width: 520px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 40px var(--shadow);
      }
      .rev-modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }
      .rev-modal-head span {
        font-weight: 600;
      }
      .rev-modal-head button {
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--ink);
        border-radius: 20px;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .rev-modal-list {
        overflow-y: auto;
        padding: 6px 18px 18px;
      }
      .rev-sent {
        padding: 11px 0;
        border-bottom: 1px solid var(--row-border);
        font-size: 1.1rem;
      }
      .rev-sent:last-child {
        border-bottom: none;
      }
      .rev-sent-nl {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      .rev-tr-toggle {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 0.75rem;
        white-space: nowrap;
        padding: 0;
      }
      .rev-sent-en {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="index.html">&larr; Overzicht</a>
    <h1>Nederlands oefenen — Tao hoofdstuk 1-10 (nieuwe woorden)</h1>
    <p class="sub" id="sub"></p>

    <div class="modes" id="modes"></div>
    <div class="stage" id="stage"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="ghost" id="speak">&#128264; Luister</button>
      <span class="score" id="score"></span>
      <button id="next">Volgende &rarr;</button>
      <button class="ghost" id="shuffle">Husselen</button>
    </div>

    <button class="theme-toggle" id="ttoggle">Donkere modus</button>
    <button class="vowel-toggle" id="vtoggle">&#128266; Klinkers</button>
    <div class="vowel-panel open" id="vowels"></div>

    <div class="rev-modal" id="rev-modal">
      <div class="rev-modal-box">
        <div class="rev-modal-head">
          <span id="rev-modal-title"></span>
          <button id="rev-modal-close">Sluiten</button>
        </div>
        <div class="rev-modal-list" id="rev-modal-list"></div>
      </div>
    </div>

    <!-- shared vocabulary projection + the verb-form display logic, so this
         page does not carry its own copy of any verb's principal parts -->
    <script src="data/vocab.js"></script>
    <script src="js/verbforms.js"></script>
    <script src="js/batch.js"></script>
    <script>
      const CARDS = [
        // ---- Werkwoorden ----
        { term: "overschatten", meaning: "to overestimate", pp: "overschat", nl: "Ik overschat het gevaar niet.", en: "I don't overestimate the danger.", level: 1, sentences: [
          { nl: "Hij overschatte de afstand.", en: "He overestimated the distance.", level: 2 },
          { nl: "We hebben de leider overschat.", en: "We have overestimated the leader.", level: 3 },
          { nl: "Zodra je leiders overschat, worden mensen machteloos.", en: "As soon as you overestimate leaders, people become powerless.", level: 4 } ] },
        { term: "overwaarderen", meaning: "to overvalue", pp: "overwaardeerd", nl: "Mensen overwaarderen geld.", en: "People overvalue money.", level: 1, sentences: [
          { nl: "Hij overwaardeerde zijn spullen.", en: "He overvalued his things.", level: 2 },
          { nl: "We hebben de prijs overwaardeerd.", en: "We have overvalued the price.", level: 3 },
          { nl: "Zodra je bezittingen overwaardeert, beginnen mensen te stelen.", en: "As soon as you overvalue possessions, people begin to steal.", level: 4 } ] },
        { term: "leiden", meaning: "to lead", pp: "geleid", nl: "De meester leidt de mensen.", en: "The master leads the people.", level: 1, sentences: [
          { nl: "Zij leidde de groep rustig.", en: "She led the group calmly.", level: 2 },
          { nl: "Hij heeft ons goed geleid.", en: "He has led us well.", level: 3 },
          { nl: "Kun je van mensen houden en hen leiden zonder je wil op te leggen?", en: "Can you love people and lead them without imposing your will?", level: 4 } ] },
        { term: "legen", meaning: "to empty", pp: "geleegd", nl: "Ik leeg de kom.", en: "I empty the bowl.", level: 1, sentences: [
